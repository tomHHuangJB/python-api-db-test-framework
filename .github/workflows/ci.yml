name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Run smoke tests
        env:
          API_BASE_URL: http://localhost:8000
          API_KEY: local-dev-key
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: appdb
          DB_USER: appuser
          DB_PASSWORD: apppass
        run: pytest -m smoke --alluredir=allure-results-smoke

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy api/app tests

      - name: Run full tests with Allure
        env:
          API_BASE_URL: http://localhost:8000
          API_KEY: local-dev-key
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: appdb
          DB_USER: appuser
          DB_PASSWORD: apppass
        run: pytest --alluredir=allure-results

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Run performance smoke (Locust)
        env:
          API_KEY: local-dev-key
          LOCUST_HOST: http://localhost:8000
        run: |
          python -m pip install -r perf/requirements.txt
          python -m locust -f perf/locustfile.py --headless -u 10 -r 2 -t 10s --csv=perf/results

      - name: Upload perf results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf/results_*.csv

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Allure report to Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/deploy-pages@v4
